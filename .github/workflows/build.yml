name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test the plugin
        run: mvn -B clean install
      - name: Package the demo app
        run: mvn -B -f examples/demo-app/pom.xml clean package -DskipTests
