# GKE "Synchronize secrets to Kubernetes Secrets" (GKE 1.33+, Workload Identity Federation).
# https://cloud.google.com/secret-manager/docs/sync-k8-secrets
#
# The Mule apps do NOT read this Kubernetes Secret: they read Secret Manager directly through the
# properties provider. This Secret only exists as a CHANGE TRIGGER for Reloader: when a new version of
# any listed secret is synced, its content hash changes, Reloader sees the update and restarts the apps,
# and the provider reads the new value at startup.
#
# Replace: RTF_APPS_NAMESPACE, SECRET_PROJECT_ID, and the secret list.
# Requires the cluster flags: --enable-secret-sync --enable-secret-sync-rotation [--secret-sync-rotation-interval=120s]
---
# Kubernetes service account used by the GKE sync controller to read the secrets.
# Grant it roles/secretmanager.secretAccessor (see scripts/setup-gcp-iam.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gsm-secret-sync
  namespace: RTF_APPS_NAMESPACE
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mule-gsm-secrets
  namespace: RTF_APPS_NAMESPACE
spec:
  provider: gke
  parameters:
    # One entry per Secret Manager secret used by the Mule apps of this namespace.
    # Use versions/latest so that new versions are picked up by rotation.
    secrets: |
      - resourceName: "projects/SECRET_PROJECT_ID/secrets/demo-api-key/versions/latest"
        path: "demo-api-key"
      - resourceName: "projects/SECRET_PROJECT_ID/secrets/demo-db-credentials/versions/latest"
        path: "demo-db-credentials"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  # Name of the resulting Kubernetes Secret. Must match the Reloader annotation in
  # kubernetes/rtf/kubernetes-template.yaml.
  name: mule-gsm-secrets
  namespace: RTF_APPS_NAMESPACE
spec:
  serviceAccountName: gsm-secret-sync
  secretProviderClassName: mule-gsm-secrets
  secretObject:
    type: Opaque
    data:
      - sourcePath: "demo-api-key"
        targetKey: "demo-api-key"
      - sourcePath: "demo-db-credentials"
        targetKey: "demo-db-credentials"
